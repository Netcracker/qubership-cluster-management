name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # A fork's PR gets a read-only token: build the image without publishing and pass it to the jobs as an artifact.
      LOCAL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    outputs:
      image: ${{ steps.ref.outputs.image || 'qcm-tools:local' }}
      local: ${{ env.LOCAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.LOCAL == 'true'
      - name: Build tools image locally
        if: env.LOCAL == 'true'
        run: docker build -t qcm-tools:local . && docker save -o "$RUNNER_TEMP/tools-image.tar" qcm-tools:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.LOCAL == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}/tools-image.tar
          retention-days: 1
      - name: Build and publish tools image
        if: env.LOCAL != 'true'
        id: build
        uses: netcracker/qubership-workflow-hub/actions/docker-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          custom-image-name: ${{ github.event.repository.name }}-tools
          tags: ${{ github.sha }}${{ github.ref == 'refs/heads/main' && ',latest' || '' }}
          setup-qemu: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference
        if: env.LOCAL != 'true'
        id: ref
        env:
          TAGS: ${{ steps.build.outputs.final-tags }}
        run: echo "image=${TAGS%%,*}" >> "$GITHUB_OUTPUT"

  validate:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.outputs.local == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}
      - name: Get tools image
        env:
          LOCAL: ${{ needs.image.outputs.local }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $LOCAL == true ]]; then docker load -i "$RUNNER_TEMP/tools-image.tar"
          else echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; fi
      - name: Validate stacks and Terraform modules
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$IMAGE" bash ./local/lab.sh check --init

  deploy:
    needs: [image, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: customer1-aws-staging
            start: start
            workflows: customers/customer1/aws
            deploy: deploy-staging-no-hook
            destroy: destroy-staging-parallel
          - stack: customer2-aws-staging
            start: start
            workflows: customers/customer2/aws
            deploy: deploy-staging
            destroy: ""
          - stack: customer1-azure-staging
            start: start-azure
            workflows: customers/customer1/azure
            deploy: deploy-staging
            destroy: destroy-staging
    name: deploy (${{ matrix.stack }})
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.outputs.local == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}
      - name: Get tools image
        env:
          LOCAL: ${{ needs.image.outputs.local }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $LOCAL == true ]]; then docker load -i "$RUNNER_TEMP/tools-image.tar"
          else echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; fi
      - name: Start tools container
        # Host network: scripts reach Floci and k3s via localhost and Docker network IPs.
        # Same workspace path: Compose bind mounts are resolved by the host daemon.
        run: |
          docker run -d --name tools --network host \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:$PWD" -w "$PWD" \
            -e ATMOS_COMPONENTS_TERRAFORM_APPLY_AUTO_APPROVE=true \
            "$IMAGE" sleep infinity
      - name: Start emulator
        run: docker exec tools bash ./local/lab.sh ${{ matrix.start }}
      - name: Deploy
        run: docker exec tools atmos workflow ${{ matrix.deploy }} -f ${{ matrix.workflows }}
      - name: Check cluster
        run: |
          docker exec tools kubectl --kubeconfig .local-runtime/kubeconfig-${{ matrix.stack }}.yaml get pods -A
          docker exec tools helm --kubeconfig .local-runtime/kubeconfig-${{ matrix.stack }}.yaml list -A
      - name: Destroy
        if: matrix.destroy != ''
        run: docker exec tools atmos workflow ${{ matrix.destroy }} -f ${{ matrix.workflows }}
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker exec tools kubectl --kubeconfig .local-runtime/kubeconfig-${{ matrix.stack }}.yaml get pods -A -o wide || true
          docker exec tools kubectl --kubeconfig .local-runtime/kubeconfig-${{ matrix.stack }}.yaml get events -A --sort-by=.lastTimestamp || true
