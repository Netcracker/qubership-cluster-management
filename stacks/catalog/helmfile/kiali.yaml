{
  "components": {
    "helmfile": {
      "kiali": {
        "vars": {
          "chart_version": !include bundle/manifest.yaml .charts.kiali.version,
          "chart_repository": !include bundle/manifest.yaml .charts.kiali.repository,
          "values": {
            "cr": {
              "create": true,
              "name": "kiali",
              "namespace": "istio-system",
              "spec": {
                "auth": {
                  "strategy": "anonymous"
                },
                "deployment": {
                  "view_only_mode": true,
                  "service_type": "NodePort"
                },
                "server": {
                  "node_port": 30081,
                  "web_root": "/"
                },
                "external_services": {
                  "prometheus": {
                    "enabled": false
                  },
                  "grafana": {
                    "enabled": false
                  },
                  "tracing": {
                    "enabled": false
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
