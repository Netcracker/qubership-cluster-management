# Isolated VM installation (docs/vm-installation.md). Every workflow needs the stack secrets:
#   local/lab.sh with-secrets customer1-aws-vm atmos workflow deploy-vm -f customers/customer1/aws-vm
workflows:
  deploy-vm:
    description: 'Deploy customer1 AWS VM stack: network, jump host, then Nexus and nodes in parallel, Kubemarine, apps; closes access at the end'
    stack: customer1-aws-vm
    steps:
    - name: network
      command: terraform apply network -auto-approve
    - name: open-access
      command: workflow open-access -f customers/customer1/aws-vm
    - name: machines
      type: parallel
      max_concurrency: 2
      fail:
        mode: wait_all
      output:
        mode: prefixed
        show_summary: true
      steps:
      - name: nexus
        type: atmos
        command: workflow deploy-nexus -f customers/customer1/aws-vm
      - name: nodes
        type: atmos
        command: terraform apply vms -auto-approve
    - name: kubemarine
      command: terraform apply kubemarine -auto-approve
    - name: access
      type: shell
      command: bash ./local/lab.sh prepare-vms customer1-aws-vm
    - name: apps
      command: workflow deploy-apps -f customers/customer1/aws-vm
    - name: close-access
      command: workflow close-access -f customers/customer1/aws-vm
  deploy-nexus:
    description: 'Internal branch: Nexus VM, Nexus from the bundle, bundle upload (all through the jump host)'
    stack: customer1-aws-vm
    steps:
    - name: nexus-vm
      command: terraform apply nexus -auto-approve
    - name: nexus-install
      type: shell
      command: bash ./local/lab.sh nexus-install customer1-aws-vm
    - name: nexus-load
      type: shell
      command: bash ./local/lab.sh nexus-load customer1-aws-vm
  deploy-apps:
    description: 'Install apps from Nexus through the tunnel (needs open-access)'
    stack: customer1-aws-vm
    steps:
    - name: istio
      command: helmfile apply istio
    - name: argocd
      command: helmfile apply argocd
    - name: kiali
      command: helmfile apply kiali
    - name: minio
      command: helmfile apply minio
    - name: headlamp
      command: helmfile apply headlamp
  open-access:
    description: 'Create the jump host and the SOCKS tunnel through it'
    stack: customer1-aws-vm
    steps:
    - name: jump-host
      command: terraform apply jump-host -auto-approve
    - name: tunnel
      type: shell
      command: bash ./local/lab.sh tunnel customer1-aws-vm
  close-access:
    description: 'Stop the tunnel and destroy the jump host (MoM step 3); open-access brings it back'
    stack: customer1-aws-vm
    steps:
    - name: tunnel
      type: shell
      command: bash ./local/lab.sh tunnel customer1-aws-vm stop
    - name: jump-host
      command: terraform destroy jump-host -auto-approve
  destroy-vm:
    description: 'Destroy customer1 AWS VM stack (VMs with the cluster on them, then the network)'
    stack: customer1-aws-vm
    steps:
    - name: tunnel
      type: shell
      command: bash ./local/lab.sh tunnel customer1-aws-vm stop
    - name: kubemarine
      command: terraform destroy kubemarine -auto-approve
    - name: vms
      command: terraform destroy vms -auto-approve
    - name: nexus
      command: terraform destroy nexus -auto-approve
    - name: jump-host
      command: terraform destroy jump-host -auto-approve
    - name: network
      command: terraform destroy network -auto-approve
