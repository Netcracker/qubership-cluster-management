workflows:
  deploy:
    description: Create infrastructure and wait for multiple Pod fields
    stack: customer1-aws-staging
    steps:
      - name: network
        command: terraform apply network -input=false -auto-approve

      - name: kubernetes
        command: terraform apply kubernetes -input=false -auto-approve

      - name: access
        type: shell
        command: pwsh -NoProfile -File ./local/scripts/Prepare-Cluster.ps1 -Stack customer1-aws-staging

      - name: manifest
        command: terraform apply manifest-wait -input=false -auto-approve

  destroy:
    description: Remove the example Pod, namespace and infrastructure
    stack: customer1-aws-staging
    steps:
      - name: manifest
        command: terraform destroy manifest-wait -input=false -auto-approve

      - name: kubernetes
        command: terraform destroy kubernetes -input=false -auto-approve

      - name: network
        command: terraform destroy network -input=false -auto-approve